[project]
name = "auto-job"
version = "1.0.0"
description = "Personal job-search agent with a FastAPI and React control room"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.116",
  "psycopg[binary]>=3.2",
  "PyYAML>=6.0",
  "requests>=2.31",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.0",
]

[tool.vercel]
entrypoint = "jobhunt.web:app"

# The React app lives in a nested directory and its generated dist/ directory
# is not committed. Build it before Vercel bundles the FastAPI function so the
# same-origin catch-all route can serve the production UI.
[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"
